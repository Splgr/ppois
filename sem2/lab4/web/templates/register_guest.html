{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Регистрация нового гостя</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">ФИО гостя</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Контактный телефон</label>
                <input type="text" name="contact" class="form-control" placeholder="+375291234567" required>
            </div>
            <button type="submit" class="btn btn-success">Зарегистрировать гостя</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
