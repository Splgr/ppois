{% extends 'base.html' %}
{% block content %}
<h2>Все номера отеля</h2>
<table class="table table-striped table-hover">
    <thead class="table-dark">
        <tr>
            <th>Номер</th>
            <th>Тип</th>
            <th>Мест</th>
            <th>Цена/сут</th>
            <th>Статус</th>
        </tr>
    </thead>
    <tbody>
        {% for room in rooms %}
        <tr>
            <td><strong>{{ room.number }}</strong></td>
            <td>{{ room.room_type }}</td>
            <td>{{ room.berths }}</td>
            <td>{{ room.price_per_day }} BYN</td>
            <td><span class="badge bg-{{ 'success' if room.status == 'available' else 'warning' if room.status == 'booked' else 'danger' }}">
                {{ room.status|upper }}
            </span></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
